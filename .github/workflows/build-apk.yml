name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21 (required by Capacitor 8 / AGP)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: bun install

      - name: Sync web assets into the Android project
        run: bunx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Build release APK (signed when a keystore is configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            cd android && KEYSTORE_PATH=../keystore.jks \
              KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
              KEY_ALIAS="$KEY_ALIAS" \
              KEY_PASSWORD="$KEY_PASSWORD" \
              ./gradlew assembleRelease
          else
            echo "No keystore configured - skipping signed release APK."
          fi

      - name: Upload APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: my-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
